<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 채팅</title>
    <link rel="stylesheet" href="chat.css">
</head>

<body>
    <div id="chat-container">
        <div id="chat-header">
            <span id="header-title">AI 채팅</span>
            <div id="mode-toggle">
                <button id="btn-normal" class="mode-btn active">일반</button>
                <button id="btn-rag" class="mode-btn">RAG</button>
            </div>
        </div>

        <div id="rag-panel">
            <div id="rag-status">문서 0개 청크 로드됨</div>
            <label id="upload-label" for="file-input">문서 업로드 (TXT / PDF / JPG / PNG)</label>
            <input type="file" id="file-input" accept=".txt,.pdf,.jpg,.jpeg,.png,.webp">
            <div id="upload-msg"></div>
            <div id="doc-list-title">업로드된 문서</div>
            <div id="doc-list"></div>
        </div>

        <div id="chat-box"></div>

        <div id="input-area">
            <input type="text" id="chat-input" placeholder="메시지를 입력하세요.">
            <button id="send-btn">전송</button>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="chat.js"></script>
</body>

</html>
