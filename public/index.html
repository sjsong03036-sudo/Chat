<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 채팅</title>
    <link rel="stylesheet" href="chat.css">
</head>

<body>
    <div id="chat-container">
        <div id="chat-header">
            <span id="header-title">AI 채팅</span>
            <div id="mode-toggle">
                <button id="btn-normal" class="mode-btn active">일반</button>
                <button id="btn-rag" class="mode-btn">RAG</button>
            </div>
        </div>

        <div id="rag-panel">
            <div id="rag-stats">
                <div class="stat-item">
                    <span class="stat-label">업로드된 문서</span>
                    <span class="stat-value" id="stat-docs">0개</span>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-label">총 청크</span>
                    <span class="stat-value" id="stat-chunks">0개</span>
                </div>
            </div>
            <div id="rag-panel-actions">
                <label id="upload-label" for="file-input">+ 문서 업로드</label>
                <input type="file" id="file-input" accept=".txt,.pdf,.jpg,.jpeg,.png,.webp">
                <button id="doc-list-btn">문서 목록 보기</button>
            </div>
            <div id="upload-msg"></div>
        </div>

        <div id="chat-box"></div>

        <div id="input-area">
            <input type="text" id="chat-input" placeholder="메시지를 입력하세요.">
            <button id="send-btn">전송</button>
        </div>
    </div>

    <!-- 문서 목록 모달 -->
    <div id="doc-modal-overlay">
        <div id="doc-modal">
            <div id="doc-modal-header">
                <span>업로드된 문서</span>
                <button id="doc-modal-close">✕</button>
            </div>
            <div id="doc-modal-list"></div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked@4.3.0/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
    <script src="chat.js"></script>
</body>

</html>
